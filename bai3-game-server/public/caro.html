<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Cờ Caro X O</title>
  <style>
    body { margin: 0; background: #222; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
    canvas { border: 2px solid #555; border-radius: 4px; cursor: crosshair; background: #f5deb3; }
    .toolbar { margin: 1rem 0; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    button { padding: .5rem 1rem; cursor: pointer; border: none; border-radius: 6px; background: #e94560; color: #fff; font-weight: 600; }
    a { color: #aaa; }
    #turn { font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h2>Cờ Caro X O (15x15)</h2>
  <div class="toolbar">
    <span id="turn">Nhấn "Ghép cặp" để chơi</span>
    <button onclick="findMatch()">Ghép cặp ngẫu nhiên</button>
    <a href="/">← Trang chủ</a>
  </div>
  <canvas id="board" width="450" height="450"></canvas>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/caro.js"></script>
</body>
</html>
